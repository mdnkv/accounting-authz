spring:
  application:
    name: accounting-authz
  datasource:
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    url: ${APP_DB_URL}
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
server:
  port: ${HTTP_PORT:8000}
  tomcat:
    connection-timeout: 2s
    keep-alive-timeout: 15s
    threads:
      max: 50
      min-spare: 5
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
