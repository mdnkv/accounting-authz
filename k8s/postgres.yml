apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-authz-db
  labels:
    db: accounting-authz-db
spec:
  selector:
    matchLabels:
      db: accounting-authz-db
  template:
    metadata:
      labels:
        db: accounting-authz-db
    spec:
      containers:
        - name: accounting-authz-db
          image: postgres:18
          env:
            - name: POSTGRES_USER
              value: acc_authz_user
            - name: POSTGRES_PASSWORD
              value: secret1234
            - name: POSTGRES_DB
              value: acc_authz_db
          resources:
            requests:
              cpu: 100m
              memory: 60Mi
            limits:
              cpu: 200m
              memory: 120Mi

---

apiVersion: v1
kind: Service
metadata:
  name: accounting-authz-db
  labels:
    db: accounting-authz-db
spec:
  type: ClusterIP
  selector:
    db: accounting-authz-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432